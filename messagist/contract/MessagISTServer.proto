//
// Protocol buffers definition for the MessagIST Server
//
syntax = "proto3";
package pt.tecnico.sirs.a61;

message SignupRequest {
    string username = 1;
    bytes password  = 2;
    bytes salt      = 3;
}

message SignupResponse {
    bool success = 1;
}

message GetSaltRequest {
    string username = 1;
}

message GetSaltResponse {
    bool success = 1;
    bytes salt   = 2;
}

message LoginRequest {
    string username = 1;
    bytes password  = 2;
}

message LoginResponse {
    bool success = 1;
    string token = 2;
}

message SendRequest {
    string token    = 1;
    string message  = 2;
    string username = 3;
    string partner  = 4;
}

message SendResponse {
    bool success    = 1;
    int32 timestamp = 2;
}

message KeepAliveRequest {
    string token              = 2;
    repeated string partners  = 3;
    repeated int32 timestamps = 4;
}

message KeepAliveResponse {
    bool success             = 1;
    repeated string partners = 2;
    repeated string messages = 3;
}

message RegisterIdentityKeyRequest {
    string token       = 1;
    bytes identity_key = 2;
}

message RegisterIdentityKeyResponse {
    bool success = 1;
}

message GetIdentityKeyRequest {
    string username = 1;
}

message GetIdentityKeyResponse {
    bytes identity_key = 1;
}

message TrySetSaltRequest {
    string token    = 1;
    string partner  = 2;
    bytes salt      = 3;
}

message TrySetSaltResponse {
    bytes salt = 1;
}

service MessagISTServer {
    rpc signup (SignupRequest) returns (SignupResponse);
    rpc getSalt (GetSaltRequest) returns (GetSaltResponse);
    rpc login (LoginRequest) returns (LoginResponse);
    rpc send (SendRequest) returns (SendResponse);
    rpc keepAlive (KeepAliveRequest) returns (KeepAliveResponse);
    rpc registerIdentityKey (RegisterIdentityKeyRequest) returns (RegisterIdentityKeyResponse);
    rpc getIdentityKey (GetIdentityKeyRequest) returns (GetIdentityKeyResponse);
    rpc trySetSalt (TrySetSaltRequest) returns (TrySetSaltResponse);
}
