//
// Protocol buffers definition for the MessagIST Server
//
syntax = "proto3";
package pt.tecnico.sirs.a61;

message SignupRequest {
    string username   = 1;
    bytes password    = 2;
    bytes identityKey = 3;
    bytes salt        = 4;
}

message SignupResponse {
    bool success = 1;
}

message GetSaltRequest {
    string username = 1;
}

message GetSaltResponse {
    bool success = 1;
    bytes salt   = 2;
}

message LoginRequest {
    string username = 1;
    bytes password  = 2;
}

message LoginResponse {
    bool success = 1;
    string token = 2;
}

message SubmitTwoFactorTokenLoginRequest {
    string username = 1;
    string token    = 2;
}

message SubmitTwoFactorTokenLoginResponse {
    bool success = 1;
    string token = 2;
}

message SubmitTwoFactorTokenSignUpRequest {
    string username = 1;
    string token    = 2;
}

message SubmitTwoFactorTokenSignUpResponse {
    bool success = 1;
}


message SendRequest {
    string token    = 1;
    string message  = 2;
    string partner  = 3;
}

message SendResponse {
    bool success    = 1;
    int32 timestamp = 2;
}

message KeepAliveRequest {
    string token              = 1;
    repeated string partners  = 2;
    repeated int32 timestamps = 3;
}

message KeepAliveResponse {
    bool success             = 1;
    repeated string partners = 2;
    repeated string messages = 3;
}

message GetIdentityKeyRequest {
    string username = 1;
}

message GetIdentityKeyResponse {
    bytes identityKey = 1;
}

message TrySetSaltRequest {
    string token    = 1;
    string partner  = 2;
    bytes salt      = 3;
}

message TrySetSaltResponse {
    bytes salt = 1;
}

service MessagISTServer {
    rpc signup (SignupRequest) returns (SignupResponse);
    rpc getSalt (GetSaltRequest) returns (GetSaltResponse);
    rpc login (LoginRequest) returns (LoginResponse);
    rpc submitTwoFactorTokenLogin(SubmitTwoFactorTokenLoginRequest) returns (SubmitTwoFactorTokenLoginResponse);
    rpc submitTwoFactorTokenSignUp(SubmitTwoFactorTokenSignUpRequest) returns (SubmitTwoFactorTokenSignUpResponse);
    rpc send (SendRequest) returns (SendResponse);
    rpc keepAlive (KeepAliveRequest) returns (KeepAliveResponse);
    rpc getIdentityKey (GetIdentityKeyRequest) returns (GetIdentityKeyResponse);
    rpc trySetSalt (TrySetSaltRequest) returns (TrySetSaltResponse);
}
